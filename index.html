<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サーキュラー・ラボ・広島</title>
<meta name="description" content="広島から「捨てる」をなくす。一般社団法人サーキュラー・ラボ・広島は、企業・大学・地域と連携し、使い捨て容器などの廃棄物を「資源」として循環させる仕組みを設計・実装しています。">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="apple-touch-icon" href="assets/logo-mark.png">
<!-- ?v= はデプロイのたびに content.js の version と同じ値に更新すること。
     Cloudflare Pages は .js に max-age=14400 を付けるうえ _headers で上書きできないため、
     これが無いと HTML だけ新しくなって古い JS と噛み合わず表示が壊れる。 -->
<script>
// 別ページから #service などハッシュ付きで来たときだけ、着地位置が決まるまで
// 描画を伏せる。お知らせの読み込みでレイアウトの高さが変わるため、そのままだと
// 一瞬ページ上部が見えてから目的のセクションへ飛ぶ。
// scroll-behavior も切っておく（有効なままだとトップから滑る様子が再生される）。
if (location.hash.length > 1) {
  document.documentElement.className += ' anchor-pending';
  // JSが途中で失敗しても必ず表示に戻す保険
  setTimeout(function () {
    document.documentElement.classList.remove('anchor-pending');
  }, 1200);
}
</script>
<script src="content.js?v=1.23.1"></script>
<script src="news.js?v=1.23.1"></script>
<script src="preview-badge.js?v=1.23.1"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --red:       #B42020;
  --red-dark:  #380C0C;
  --red-deep:  #1E0606;
  --red-mid:   #6A2010;
  --red-light: #FFF8F5;
  --orange:    #F07820;
  --orange-dk: #86400A;
  --border:    #F0D8B8;
  --white:     #ffffff;
  --fs-xs:  11px;
  --fs-sm:  13px;
  --fs-md:  15px;
  --fs-lg:  18px;
  --fs-xl:  clamp(22px, 3vw, 34px);
  --fs-2xl: clamp(22px, 2.4vw, 36px);
  --radius-sm:   8px;
  --radius-md:   14px;
  --radius-lg:   20px;
  --radius-full: 999px;
}

/* ナビが position:fixed で 64px あるため、その分アンカーの着地位置を下げる。
   これが無いとセクションの先頭がナビの裏に隠れ、どこへ飛んでも同じ見た目になる。 */
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
/* 着地位置が確定するまでの数百ミリ秒だけ伏せる（付与は head のスクリプト） */
html.anchor-pending { scroll-behavior: auto; }
html.anchor-pending body { visibility: hidden; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  color: var(--red-dark);
  background: var(--white);
  line-height: 1.8;
  font-size: var(--fs-md);
}

.tag {
  display: block;
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--orange-dk);
  margin-bottom: 14px;
}
h1 {
  font-size: var(--fs-2xl);
  font-weight: 800;
  line-height: 1.45;
  color: var(--red-dark);
  word-break: keep-all;
  line-break: strict;
  overflow-wrap: break-word;
}
h2 {
  font-size: var(--fs-xl);
  font-weight: 800;
  line-height: 1.4;
  color: var(--red-dark);
  margin-bottom: 20px;
}
h3 {
  font-size: var(--fs-lg);
  font-weight: 700;
  color: var(--red-dark);
  margin-bottom: 10px;
}
p { color: var(--red-mid); line-height: 1.9; }

.highlight {
  background: linear-gradient(transparent 54%, rgba(240,120,32,0.45) 54%);
}
.h1-line2 { display: block; }

.container { max-width: 1100px; margin: 0 auto; padding: 0 6%; }
section { padding: 100px 0; }
section:nth-child(even) { background: var(--red-light); }
section:nth-child(odd)  { background: var(--white); }

/* ============================================================
   ヘッダー（全ページ共通）
   index.html / activities.html / recruit.html / 404.html / pccp/index.html
   の5ファイルに同じものが入っています。直すときは5か所すべてに反映すること。
   ============================================================ */
nav {
  position: sticky; top: 0; z-index: 100;
  height: 64px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  padding: 0 5%;
  background: rgba(255,255,255,0.96);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-bottom: 3px solid var(--red);
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 700;
  color: var(--red-dark); letter-spacing: 0.04em;
  text-decoration: none;
}
.nav-logo-mark { height: 34px; width: auto; display: block; }
/* 団体名は折り返さない（折り返すと1文字ずつ縦に割れて崩れる）。
   入りきらない幅では末尾を「…」で省略する。min-width:0 が無いと
   flex アイテムが縮まず、はみ出して横スクロールが出る。 */
.nav-logo { min-width: 0; }
.nav-logo span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* align-items を指定しないと、テキストリンクがCTAボタンの高さまで引き伸ばされ、
   文字がその上端に張り付いて縦位置がずれる */
.nav-links { display: flex; align-items: center; gap: 26px; }
.nav-links a {
  position: relative;
  font-size: 12px; font-weight: 500;
  color: var(--red-mid); text-decoration: none;
  letter-spacing: 0.06em; transition: color 0.2s;
}
.nav-links a:hover { color: var(--red); }
/* 現在地表示。CTAボタン（会員になる／お問い合わせ）には付けない */
.nav-links a.is-current { color: var(--red); }
.nav-links a.is-current::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -7px;
  height: 2px; background: var(--orange); border-radius: 2px;
}
/* 会員になる と お問い合わせ は一覧に混ぜずボタンとして置く */
.nav-cta {
  padding: 8px 18px; border-radius: var(--radius-full);
  font-weight: 700; white-space: nowrap;
  transition: background 0.2s, color 0.2s, transform 0.2s;
}
.nav-cta-primary { background: var(--red); color: var(--white) !important; }
.nav-cta-primary:hover { background: #8C1818; transform: translateY(-1px); }
.nav-cta-ghost { border: 1.5px solid var(--orange); color: var(--orange-dk) !important; }
.nav-cta-ghost:hover { background: var(--orange); color: var(--white) !important; }

.hamburger {
  display: none; flex-direction: column; gap: 5px;
  background: none; border: none; cursor: pointer; padding: 4px;
}
.hamburger span {
  display: block; width: 22px; height: 2px;
  background: var(--red-dark); border-radius: 2px;
  transition: transform 0.3s, opacity 0.3s;
}
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.mobile-menu {
  display: none; position: fixed; inset: 0;
  background: rgba(255,255,255,0.98);
  flex-direction: column; align-items: center; justify-content: center; gap: 36px;
  z-index: 150;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-size: 22px; font-weight: 700;
  color: var(--red-dark); text-decoration: none; letter-spacing: 0.06em;
}
.mobile-menu .ml-cta {
  padding: 12px 32px; border-radius: var(--radius-full);
  background: var(--red); color: var(--white); font-size: 18px;
}

.btn {
  display: inline-block;
  padding: 13px 36px;
  border-radius: var(--radius-full);
  font-size: var(--fs-sm);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-decoration: none;
  transition: background 0.2s, color 0.2s, transform 0.2s;
  border: none; cursor: pointer;
}
.btn-red   { background: var(--red); color: var(--white); }
.btn-red:hover { background: #8C1818; transform: translateY(-2px); }
.btn-ghost { background: transparent; color: var(--orange-dk); border: 2px solid var(--orange); }
.btn-ghost:hover { background: var(--orange); color: var(--white); }
.btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 36px; }

.hero {
  display: flex; align-items: center; justify-content: space-between; gap: clamp(24px, 5vw, 72px);
  /* ナビが sticky（=高さ64pxを占有する）ため、その分を引いた余白にしている */
  padding: clamp(32px, 4vw, 64px) 6% clamp(48px, 5vw, 72px);
  background: var(--white);
}
.hero-inner { max-width: 700px; width: 100%; }
.hero-visual {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
  position: relative;
}
.hero-visual::before {
  content: ''; position: absolute; inset: -12%;
  background: radial-gradient(circle, rgba(240,120,32,0.12), rgba(240,120,32,0) 70%);
  border-radius: 50%;
}
.hero-visual img { position: relative; width: clamp(190px, 24vw, 340px); height: auto; display: block; }
.hero h1 { margin: 16px 0 24px; }
.hero-lead {
  font-size: clamp(16px, 2vw, 20px);
  font-weight: 700; color: var(--red-dark); margin-bottom: 8px;
}
.hero-body { font-size: clamp(14px, 1.6vw, 16px); color: var(--red-mid); line-height: 2.0; }

[hidden] { display: none !important; }

.news-list { display: grid; gap: 12px; margin-top: 40px; }
.news-item {
  display: flex; align-items: baseline; gap: 22px;
  padding: 18px 24px;
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius-md); text-decoration: none;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}
a.news-item:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(180,32,32,0.08); border-color: var(--orange); }
.news-date { flex: 0 0 auto; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--orange-dk); }
.news-item-title { font-size: 14px; font-weight: 700; color: var(--red-dark); line-height: 1.7; }
.news-empty { margin-top: 36px; font-size: 14px; }
.news-more { margin-top: 32px; }

/* バッジ（開催予定・プロジェクト名） */
.badge {
  display: inline-block; flex: 0 0 auto;
  padding: 3px 10px; border-radius: var(--radius-full);
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  line-height: 1.6; white-space: nowrap;
}
.badge-upcoming { background: var(--orange); color: var(--white); }
.badge-project  { background: rgba(180,32,32,0.08); color: var(--red); }
.news-badges { display: flex; gap: 6px; flex: 0 0 auto; }

/* 開催予定（until が未来の記事があるときだけ表示） */
.upcoming { margin-top: 40px; display: grid; gap: 12px; }
.upcoming-item {
  display: block; padding: 24px 28px; text-decoration: none;
  background: linear-gradient(135deg, rgba(240,120,32,0.08), rgba(255,248,245,0.6));
  border: 2px solid var(--orange); border-radius: var(--radius-lg);
  transition: transform 0.2s, box-shadow 0.2s;
}
a.upcoming-item:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(240,120,32,0.18); }
.upcoming-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.upcoming-title { margin-top: 10px; font-size: 17px; font-weight: 800; color: var(--red-dark); line-height: 1.6; }
.upcoming-more { margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--orange-dk); }

.mission-inner { display: grid; grid-template-columns: 100px 1fr; gap: 60px; align-items: center; }
.mission-letter { font-size: 100px; font-weight: 800; color: var(--orange); opacity: 0.15; line-height: 1; -webkit-user-select: none; user-select: none; }

.service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 48px; }
.service-card {
  background: var(--white); border-radius: var(--radius-lg);
  padding: 32px 26px; border: 1px solid var(--border);
  border-top: 4px solid var(--orange);
  transition: transform 0.2s, box-shadow 0.2s;
}
.service-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(180,32,32,0.08); }
.service-num { font-size: 32px; font-weight: 800; color: var(--orange-dk); margin-bottom: 14px; line-height: 1; }
.service-card h3 { font-size: 15px; }
.service-card p  { font-size: 13px; margin-top: 8px; }

/* Service の補足として置く取り組み例。サービス3つより一段弱い扱いにする */
.service-cases { margin-top: 64px; padding-top: 48px; border-top: 1px solid var(--border); }
.service-cases h3 { font-size: var(--fs-lg); margin-bottom: 8px; }
.service-cases-lead { font-size: var(--fs-sm); margin-bottom: 8px; }
.case-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 28px; }
.case-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 24px; overflow: hidden;
}
.case-photo {
  aspect-ratio: 4 / 3; border-radius: var(--radius-md); overflow: hidden;
  margin-bottom: 20px; background: var(--red-light); border: 1px solid var(--border);
}
.case-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.case-card h4 { font-size: 15px; font-weight: 700; color: var(--red-dark); margin-bottom: 10px; line-height: 1.6; }
.case-card p { font-size: 13px; }

/* Projects — 自分たちが動かしているプロジェクト（1件でも成立する横並びカード） */
.project-grid { display: grid; gap: 24px; margin-top: 48px; }
.project-card {
  display: grid; grid-template-columns: 280px 1fr; gap: 32px; align-items: center;
  position: relative; overflow: hidden;
  padding: 32px; background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius-lg); text-decoration: none;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}
.project-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--red); }
a.project-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(180,32,32,0.08); border-color: var(--orange); }
.project-photo { aspect-ratio: 4 / 3; border-radius: var(--radius-md); overflow: hidden; background: var(--red-light); border: 1px solid var(--border); }
.project-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* プロジェクト名を主役にする。略称→正式名称→キャッチの順に読ませる */
.project-abbr { display: block; font-size: 13px; font-weight: 800; letter-spacing: 0.24em; color: var(--orange-dk); }
.project-name {
  margin: 10px 0 0; font-size: clamp(22px, 2.6vw, 34px); font-weight: 800;
  line-height: 1.25; letter-spacing: 0.01em; color: var(--red-dark);
}
.project-card p { font-size: 14px; }
/* .project-card p より後ろかつ同等以上の詳細度でないと上書きされる */
.project-card .project-tagline { margin-top: 12px; font-size: 16px; font-weight: 700; color: var(--red-dark); }
.project-card .project-tagline + p { margin-top: 12px; }
/* 実績は地の文として置く。矢印付きの箇条書きにすると個別記事へのリンクに見えてしまう */
.project-note {
  margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
  font-size: 13px; line-height: 1.8; color: var(--red-mid);
}
.project-link { display: inline-block; margin-top: 20px; font-size: 13px; font-weight: 700; color: var(--orange-dk); }


/* About セクションの後半に置くメンバー紹介。区切り線で使命の話と分ける */
.about-members { margin-top: 64px; padding-top: 48px; border-top: 1px solid var(--border); }
.about-members h3 { font-size: var(--fs-lg); margin-bottom: 0; }
.member-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 28px; }
.member-card {
  background: var(--red-light); border-radius: var(--radius-lg);
  padding: 32px; border: 1px solid var(--border);
  display: flex; gap: 22px; align-items: flex-start;
}
.member-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--red); color: var(--white);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; flex-shrink: 0;
  overflow: hidden;
}
.member-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.member-role { font-size: 10px; font-weight: 700; color: var(--orange-dk); letter-spacing: 0.1em; margin-bottom: 4px; }
.member-name { font-size: 17px; font-weight: 800; color: var(--red-dark); margin-bottom: 8px; }
.member-desc { font-size: 13px; line-height: 1.8; }

.join { background: var(--red-deep) !important; color: var(--white); }
.join .tag { color: rgba(240,120,32,0.9); }
.join h2   { color: var(--white); }
.join > .container > p { color: rgba(255,215,200,0.85); }
.join-plans { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 48px; }
.plan-card { border-radius: var(--radius-lg); padding: 32px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); }
.plan-card.featured { border-color: rgba(240,120,32,0.5); }
.plan-badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.15em; padding: 3px 10px; border-radius: var(--radius-full); background: rgba(240,120,32,0.25); color: rgba(255,200,140,1); margin-bottom: 12px; }
.plan-name { font-size: 17px; font-weight: 700; color: var(--white); margin-bottom: 6px; }
.plan-fee  { font-size: 22px; font-weight: 800; color: rgba(255,200,140,1); margin-bottom: 4px; letter-spacing: 0.02em; }
.plan-note { font-size: 12px; color: rgba(255,215,200,0.55); margin-bottom: 20px; }
.plan-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: rgba(240,160,80,0.9); margin: 16px 0 8px; }
.plan-items { list-style: none; }
.plan-items li { font-size: 12px; color: rgba(255,215,200,0.8); padding: 4px 0; display: flex; gap: 8px; line-height: 1.7; }
.plan-items li::before { content: '✓'; color: var(--orange); flex-shrink: 0; }
.join-uses { background: rgba(255,255,255,0.05); border-radius: var(--radius-lg); padding: 32px; border: 1px solid rgba(255,255,255,0.08); margin-top: 32px; }
.join-uses h3 { font-size: 14px; font-weight: 700; color: rgba(240,160,80,1); margin-bottom: 16px; }
.join-uses li { font-size: 14px; color: rgba(255,215,200,0.85); list-style: none; display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); line-height: 1.7; }
.join-uses li::before { content: '→'; color: var(--orange); flex-shrink: 0; }
.join-note { margin-top: 24px; padding: 24px 28px; background: rgba(255,255,255,0.04); border-radius: var(--radius-md); border-left: 4px solid var(--orange); font-size: 14px; color: rgba(255,215,200,0.8); line-height: 1.9; }
/* 会員企業。パートナー会員はロゴ、メンバー会員は社名テキストで掲載する。
   セクションが濃色のため、ロゴは白いカードに載せて元の色が沈まないようにする。 */
.members { margin-top: 64px; }
.members + .members { margin-top: 44px; }
.members-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: rgba(240,120,32,0.9); margin-bottom: 6px; text-transform: uppercase; }
.members-title { font-size: 15px; font-weight: 700; color: var(--white); margin-bottom: 18px; }
.logo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.logo-item { display: block; text-decoration: none; transition: transform 0.2s; }
a.logo-item:hover { transform: translateY(-2px); }
a.logo-item:hover .logo-card { box-shadow: 0 12px 28px rgba(0,0,0,0.3); }
a.logo-item:hover .logo-name { color: var(--white); }
.logo-card {
  background: var(--white); border-radius: var(--radius-md);
  padding: 18px; min-height: 96px;
  display: flex; align-items: center; justify-content: center;
  transition: box-shadow 0.2s;
}
/* ロゴの縦横比がまちまちなので、高さの上限を広めに取って見た目の大きさを揃える */
.logo-card img { max-width: 100%; max-height: 60px; width: auto; height: auto; display: block; }
/* ロゴだけでは社名が読み取れないことがあるため、下にテキストも添える
   （画像の alt は空にして、読み上げの重複を避けている） */
.logo-name {
  display: block; margin-top: 10px; text-align: center;
  font-size: 12px; font-weight: 700; line-height: 1.7;
  color: rgba(255,215,200,0.92); transition: color 0.2s;
}
.name-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.name-card {
  display: block; text-decoration: none;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-md); padding: 20px 18px; text-align: center;
  font-size: 13px; font-weight: 700; color: rgba(255,215,200,0.92); line-height: 1.9;
  transition: transform 0.2s, background 0.2s, border-color 0.2s, color 0.2s;
}
a.name-card:hover {

<script>
(function () {
  function s(id, val) {
    var el = document.getElementById(id);
    if (el && val != null && val !== '') el.innerHTML = String(val).replace(/\n/g, '<br>');
  }
  function setText(id, val) {
    var el = document.getElementById(id);
    if (el && val != null) el.textContent = val;
  }

  // Nav
  s('nav_logo', content.nav_logo);

  // Hero — h1の1行目はオレンジハイライト + 末尾の句読点を直前1文字と nowrap で結合（行頭禁則）
  var heroH1 = document.getElementById('hero_h1');
  if (heroH1 && content.hero_heading) {
    var heroLines = content.hero_heading.split('\n');
    var line1Html = (heroLines[0] || '').replace(/(.)([、。])$/, '<span style="white-space:nowrap">$1$2</span>');
    heroH1.innerHTML = '<span class="highlight">' + line1Html + '</span>'
                     + '<span class="h1-line2">' + (heroLines[1] || '') + '</span>';
  }
  s('hero_tag', content.hero_tag);
  var heroSub = content.hero_sub ? content.hero_sub.split('\n') : [];
  s('hero_lead', heroSub[0] || '');
  s('hero_body', heroSub.slice(1).join('\n'));

  // Activities — news.md を読み込み、開催予定を上に、それ以外の最新3件を下に表示
  // （読めなければセクションごと非表示）
  s('news_tag', content.news_tag);
  s('news_title', content.news_title);
  setText('news_more', content.news_more);
  fetch('news.md', { cache: 'no-cache' })
    .then(function (res) {
      if (!res.ok) throw new Error('news.md: ' + res.status);
      return res.text();
    })
    .then(function (text) {
      // トップに出すのは合計3件まで。開催予定は上の枠に出し、その分だけ下の一覧を減らす
      // （同じ記事を枠と一覧の両方に出さない）
      var MAX = 3;
      var all = window.CLHNews.parseNews(text);
      var upcoming = all.filter(function (n) { return window.CLHNews.isUpcoming(n.until); }).slice(0, MAX);
      var rest = all.filter(function (n) { return !window.CLHNews.isUpcoming(n.until); })
                    .slice(0, Math.max(0, MAX - upcoming.length));

      var box = document.getElementById('upcoming');
      box.innerHTML = upcoming.map(upcomingHtml).join('');
      box.hidden = upcoming.length === 0;

      var list = document.getElementById('news_list');
      list.innerHTML = rest.length
        ? rest.map(newsItemHtml).join('')
        : '<p class="news-empty">' + window.CLHNews.escapeHtml(content.news_empty || '') + '</p>';
      document.getElementById('activities').hidden = false;

      // 他ページから #join などに直接来た場合、ブラウザは Activities が hidden の
      // 状態で着地位置を決めている。ここで高さが増えて目的のセクションが下へ
      // ずれるため、表示後にもう一度合わせ直してから描画を戻す。
      if (location.hash.length > 1) {
        var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView({ behavior: 'instant', block: 'start' });
      }
      document.documentElement.classList.remove('anchor-pending');
    })
    .catch(function () {
      // ローカルのfile://など、読めない場合はセクションを出さない。
      // 伏せたままにはできないので描画は必ず戻す。
      document.documentElement.classList.remove('anchor-pending');
    });

  function upcomingHtml(item) {
    var esc = window.CLHNews.escapeHtml;
    // 枠に出すのは告知日ではなく開催日（until）。読み手が知りたいのは「いつやるか」
    var shown = item.until || item.date;
    var inner = '<div class="upcoming-meta">'
              + window.CLHNews.badgesHtml(item, content)
              + '<time class="news-date" datetime="' + esc(shown) + '">'
              + esc(window.CLHNews.formatDate(shown)) + '</time>'
              + '</div>'
              + '<div class="upcoming-title">' + esc(item.title) + '</div>';
    return item.id
      ? '<a class="upcoming-item" href="activities.html?id=' + encodeURIComponent(item.id) + '">'
        + inner + '<div class="upcoming-more">' + esc(content.upcoming_more || '') + ' →</div></a>'
      : '<div class="upcoming-item">' + inner + '</div>';
  }

  function newsItemHtml(item) {
    var esc = window.CLHNews.escapeHtml;
    var badges = window.CLHNews.badgesHtml(item, content);
    var inner = '<time class="news-date" datetime="' + esc(item.date) + '">'
              + esc(window.CLHNews.formatDate(item.date)) + '</time>'
              + (badges ? '<span class="news-badges">' + badges + '</span>' : '')
              + '<span class="news-item-title">' + esc(item.title) + '</span>';
    return item.id
      ? '<a class="news-item" href="activities.html?id=' + encodeURIComponent(item.id) + '">' + inner + '</a>'
      : '<div class="news-item">' + inner + '</div>';
  }

  // Mission — タイトルにオレンジハイライト
  var missionTitle = document.getElementById('mission_title');
  if (missionTitle && content.mission_title) {
    missionTitle.innerHTML = '<span class="highlight">' + content.mission_title + '</span>';
  }
  s('mission_tag', content.mission_tag);
  s('mission_text', content.mission_text);

  // Service
  s('service_tag', content.service_tag);
  s('service_title', content.service_title);
  s('s1_title', content.service_item1_title); s('s1_text', content.service_item1_text);
  s('s2_title', content.service_item2_title); s('s2_text', content.service_item2_text);
  s('s3_title', content.service_item3_title); s('s3_text', content.service_item3_text);
  // Service の補足（取り組み例）
  s('cases_title', content.cases_title); s('cases_lead', content.cases_lead);
  s('c1_title', content.case1_title); s('c1_text', content.case1_text);
  s('c2_title', content.case2_title); s('c2_text', content.case2_text);

  // Projects（見出しのハイライトは Hero と Mission だけに絞っている）
  s('project_tag', content.projects_tag);
  s('project_title', content.projects_title);
  s('proj1_abbr', content.proj1_abbr); s('proj1_name', content.proj1_name);
  s('proj1_tagline', content.proj1_tagline);
  s('proj1_text', content.proj1_text); s('proj1_note', content.proj1_note);
  setText('proj1_link', (content.proj1_link || '') + ' →');

  // Member（About セクションの後半に統合済み。tag は About 側に一本化したので出さない）
  s('member_title', content.member_title);
  s('m1_role', content.member1_role); s('m1_name', content.member1_name); s('m1_desc', content.member1_desc);
  s('m2_role', content.member2_role); s('m2_name', content.member2_name); s('m2_desc', content.member2_desc);

  // Join Us
  s('join_tag', content.join_tag);
  s('join_title', content.join_title);
  s('join_text', content.join_text);
  s('p1_badge', content.plan1_label); s('p1_name', content.plan1_title);
  s('p1_fee', content.plan1_fee); s('p1_note', content.plan_note);
  s('p1_i1', content.plan1_item1); s('p1_i2', content.plan1_item2); s('p1_i3', content.plan1_item3);
  s('p2_badge', content.plan2_label); s('p2_name', content.plan2_title);
  s('p2_fee', content.plan2_fee); s('p2_note', content.plan_note);
  s('p2_i1', content.plan2_item1); s('p2_i2', content.plan2_item2);
  s('p2_i3', content.plan2_item3); s('p2_i4', content.plan2_item4);
  s('p2_i5', content.plan2_item5); s('p2_i6', content.plan2_item6); s('p2_i7', content.plan2_item7);
  s('uses_title', content.join_use_title);
  s('use1', content.join_use1); s('use2', content.join_use2); s('use3', content.join_use3);
  s('join_note', content.join_note);
  s('partner_members_title', content.partner_members_title);
  s('regular_members_title', content.regular_members_title);

  // Contact
  s('contact_tag', content.contact_tag);
  s('contact_title', content.contact_title);
  s('contact_text', content.contact_text);
  var orgInfo = document.getElementById('org_info');
  if (orgInfo) {
    orgInfo.innerHTML = (content.org_eyebrow ? '<span class="org-eyebrow">' + content.org_eyebrow + '</span>' : '')
                      + (content.org_name || '') + '<br>'
                      + (content.org_address || '') + '<br>'
                      + '<a href="' + content.org_url + '">' + content.org_url + '</a>';
  }
  var contactBtn = document.getElementById('contact_btn');
  if (contactBtn) {
    contactBtn.textContent = content.contact_button;
    contactBtn.href = 'mailto:' + content.contact_email;
  }

  // Footer
  s('footer_text', content.footer_text);
  setText('footer_version', content.version ? 'v' + content.version : '');

  // Mobile menu — open状態を一元管理し aria 属性も同期
  var hamburger  = document.getElementById('hamburger');
  var mobileMenu = document.getElementById('mobileMenu');
  function setMenuOpen(open) {
    hamburger.classList.toggle('open', open);
    mobileMenu.classList.toggle('open', open);
    hamburger.setAttribute('aria-expanded', String(open));
    mobileMenu.setAttribute('aria-hidden', String(!open));
  }
  hamburger.addEventListener('click', function () {
    setMenuOpen(!hamburger.classList.contains('open'));
  });
  mobileMenu.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () { setMenuOpen(false); });
  });

  // グロナビの現在地表示。トップページは1枚もののため、
  // 画面上部にきているセクションに応じて切り替える。
  // 会員になる／お問い合わせのボタンは行動の入口なので対象外。
  var spy = (function () {
    var links = {};
    document.querySelectorAll('.nav-links a[href^="#"]').forEach(function (a) {
      if (!a.classList.contains('nav-cta')) links[a.getAttribute('href').slice(1)] = a;
    });
    // 判定はページ内の全セクションで行う。Join Us まで進んだら
    // Projects が点きっぱなしになるのを防ぐため。
    var sections = [].slice.call(document.querySelectorAll('body > section[id]'));
    if (!sections.length) return function () {};

    return function update() {
      var current = null;
      sections.forEach(function (el) {
        if (el.hidden || el.offsetParent === null) return;
        if (el.getBoundingClientRect().top <= 100) current = el.id;
      });
      Object.keys(links).forEach(function (id) {
        var on = id === current;
        links[id].classList.toggle('is-current', on);
        if (on) links[id].setAttribute('aria-current', 'true');
        else links[id].removeAttribute('aria-current');
      });
    };
  })();

  // requestAnimationFrame は使わない。非表示タブでは発火せず、
  // 間引き用のフラグが立ったまま二度と戻らなくなるため。
  // 判定は数要素の位置を見るだけなので毎回実行してよい。
  window.addEventListener('scroll', spy, { passive: true });
  window.addEventListener('resize', spy);
  // お知らせの読み込みでセクションの高さが変わるため、そのあとにも走らせる
  window.addEventListener('load', spy);
  setTimeout(spy, 1200);
  spy();
})();
</script>
</body>
</html>
